openapi: 3.0.3
info:
  title: ShipSystem API
  version: 0.2.0
  description: |
    Production-facing REST contract for the ShipSystem Go API.
    Protected operations inherit the global cookie-or-bearer security requirement.
    Each operation also declares its effective RBAC scope in `x-roles`.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Auth
  - name: Ships
  - name: Alarms
  - name: Dispatch
  - name: Battle
  - name: Analytics
  - name: RBAC
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and set the auth cookie
      security: []
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Clear the auth cookie
      security: []
      x-roles: []
      responses:
        "204":
          description: Logout succeeded
  /ships:
    get:
      tags: [Ships]
      summary: List ships
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Keyword"
      responses:
        "200":
          description: Paged ships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipPageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Ships]
      summary: Create a ship
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipUpsertRequest"
      responses:
        "201":
          description: Ship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ships/{id}:
    get:
      tags: [Ships]
      summary: Get a ship
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "200":
          description: Ship detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Ships]
      summary: Update a ship
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/NumericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipUpsertRequest"
      responses:
        "200":
          description: Ship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Ships]
      summary: Soft delete a ship
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "204":
          description: Ship deleted or already absent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ships/{id}/locations:
    post:
      tags: [Ships]
      summary: Report a ship location
      x-roles: [admin, dispatcher, analytics_service]
      parameters:
        - $ref: "#/components/parameters/NumericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipLocationReportRequest"
      responses:
        "201":
          description: Location stored, with an optional alarm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ships/{id}/tracks:
    get:
      tags: [Ships]
      summary: List ship track points
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/NumericId"
        - $ref: "#/components/parameters/StartTime"
        - $ref: "#/components/parameters/EndTime"
      responses:
        "200":
          description: Ship track points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /alarms:
    get:
      tags: [Alarms]
      summary: List alarms
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/AlarmStatus"
      responses:
        "200":
          description: Paged alarms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmPageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /alarms/{id}/ack:
    put:
      tags: [Alarms]
      summary: Acknowledge an alarm idempotently
      x-roles: [admin, dispatcher]
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "200":
          description: Alarm after ACK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alarm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /dispatch-events:
    get:
      tags: [Dispatch]
      summary: List dispatch events
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/DispatchStatus"
      responses:
        "200":
          description: Paged dispatch events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchEventPageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Dispatch]
      summary: Create a dispatch event
      x-roles: [admin, dispatcher]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchEventCreateRequest"
      responses:
        "201":
          description: Dispatch event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /dispatch-events/{id}/status:
    put:
      tags: [Dispatch]
      summary: Update dispatch event status idempotently
      x-roles: [admin, dispatcher]
      parameters:
        - $ref: "#/components/parameters/NumericId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchStatusUpdateRequest"
      responses:
        "200":
          description: Dispatch event after transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /battle/scenarios:
    get:
      tags: [Battle]
      summary: List built-in battle scenarios
      x-roles: [admin, dispatcher, viewer]
      responses:
        "200":
          description: Battle scenarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleScenarioListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /battle/sessions:
    get:
      tags: [Battle]
      summary: List battle sessions
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Paged battle sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleSessionPageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Battle]
      summary: Create a battle session
      x-roles: [admin, dispatcher]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleSessionCreateRequest"
      responses:
        "201":
          description: Battle session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleSessionCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /battle/sessions/{sessionId}/timeline:
    get:
      tags: [Battle]
      summary: List battle snapshot timeline
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Battle timeline items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleTimelineResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /battle/sessions/{sessionId}/snapshots:
    get:
      tags: [Battle]
      summary: List battle snapshots
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/FromTick"
        - $ref: "#/components/parameters/ToTick"
      responses:
        "200":
          description: Battle snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleSnapshotListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /battle/sessions/{sessionId}/report:
    get:
      tags: [Battle]
      summary: Get the battle report
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Battle report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /battle/sessions/{sessionId}/state:
    get:
      tags: [Battle]
      summary: Get the current battle state
      x-roles: [admin, dispatcher, viewer]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Battle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /battle/sessions/{sessionId}/stop:
    post:
      tags: [Battle]
      summary: Stop a battle session idempotently
      x-roles: [admin, dispatcher]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Battle state after stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /radar/reports:
    post:
      tags: [Battle]
      summary: Receive an analytics radar report callback
      x-roles: [admin, dispatcher, analytics_service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarReportPayload"
      responses:
        "202":
          description: Radar report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /analytics/simulate/status:
    get:
      tags: [Analytics]
      summary: Get analytics simulator status
      x-roles: [admin, dispatcher]
      responses:
        "200":
          description: Analytics status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProxyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/AnalyticsServiceFailure"
  /analytics/simulate/start:
    post:
      tags: [Analytics]
      summary: Start the location simulator
      x-roles: [admin, dispatcher]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationStartRequest"
      responses:
        "200":
          description: Analytics response payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProxyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/AnalyticsServiceFailure"
  /analytics/simulate/stop:
    post:
      tags: [Analytics]
      summary: Stop the location simulator
      x-roles: [admin, dispatcher]
      responses:
        "200":
          description: Analytics response payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProxyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/AnalyticsServiceFailure"
  /analytics/simulate/battle/start:
    post:
      tags: [Analytics]
      summary: Start the battle simulator
      x-roles: [admin, dispatcher]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleSimulationStartRequest"
      responses:
        "200":
          description: Analytics response payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProxyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/AnalyticsServiceFailure"
  /analytics/simulate/battle/stop:
    post:
      tags: [Analytics]
      summary: Stop the battle simulator
      x-roles: [admin, dispatcher]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleSimulationStopRequest"
      responses:
        "200":
          description: Analytics response payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsProxyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/AnalyticsServiceFailure"
  /rbac/users:
    get:
      tags: [RBAC]
      summary: List users
      x-roles: [super_admin]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /rbac/roles:
    get:
      tags: [RBAC]
      summary: List roles
      x-roles: [super_admin]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /rbac/menus:
    get:
      tags: [RBAC]
      summary: List menus
      x-roles: [super_admin]
      responses:
        "200":
          description: Menus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: shipsystem_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    NumericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Keyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
    AlarmStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [OPEN, ACKED]
    DispatchStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [NEW, ASSIGNED, IN_PROGRESS, RESOLVED, CLOSED]
    StartTime:
      name: start
      in: query
      required: false
      schema:
        type: string
        format: date-time
    EndTime:
      name: end
      in: query
      required: false
      schema:
        type: string
        format: date-time
    FromTick:
      name: from
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    ToTick:
      name: to
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: Invalid request parameters or JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or rejected authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated role is not allowed to access this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Target resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected backend failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AnalyticsServiceFailure:
      description: Analytics upstream request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnalyticsErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: request is invalid
        requestId:
          type: string
          description: Backend request correlation ID.
          example: req-9f4cbe51
    AnalyticsErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [message, upstreamStatus]
          properties:
            upstreamStatus:
              type: integer
              example: 503
            upstreamRequestId:
              type: string
              example: ana-7d4f79
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          example: admin
        password:
          type: string
          minLength: 1
          example: Admin123!
    LoginResponse:
      type: object
      required: [token, user, menus]
      properties:
        token:
          type: string
          description: JWT also set as the `shipsystem_token` HttpOnly cookie.
        user:
          $ref: "#/components/schemas/User"
        menus:
          type: array
          items:
